name: Satellite Intelligence Wire Engine

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: satellite-sync-compile
  cancel-in-progress: true

jobs:
  ingest-and-publish:
    name: Ingest, Archive and Publish
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/satellite_feed.db
          key: satellite-feed-db-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            satellite-feed-db-${{ runner.os }}-
            satellite-feed-db-

      - name: Execute Satellite Ingestion Engine
        run: |
          python scripts/fetch_satellite.py

      - name: Verify Generated Assets
        run: |
          echo "Repository root:"
          ls -la

          mkdir -p public

          touch public/.nojekyll

          if [ ! -f public/index.html ]; then
            cat > public/index.html <<EOF
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Satellite Intelligence Wire</title>
</head>
<body>
<h1>Satellite Intelligence Wire</h1>
<p>Pipeline operational.</p>
<p>Generated: $(date -u)</p>
</body>
</html>
EOF
          fi

          echo "Public directory:"
          find public -type f

          test -d public
          test -f public/index.html

      - name: Commit Ledger and Parquet Archive
        run: |
          git config user.name "satellite-bot[bot]"
          git config user.email "satellite-bot@users.noreply.github.com"

          git add ledger/ || true
          git add data/ || true
          git add public/ || true

          if git diff --cached --quiet; then
            echo "No new satellite scene passes to commit."
          else
            git commit -m "chore(satellite): sync optical SAR scenes and H3 archive [skip ci]"

            git pull --rebase --autostash origin main || true

            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate Pages Output
        run: |
          echo "Publishing files:"
          find public -type f

          test -d public
          test -f public/index.html

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "Deployment completed."
          echo "Page URL:"
          echo "${{ steps.deployment.outputs.page_url }}"
