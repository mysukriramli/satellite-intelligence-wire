name: Satellite Intelligence Wire Engine

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: satellite-sync-compile
  cancel-in-progress: true

jobs:
  ingest-and-publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/satellite_feed.db
          key: satellite-feed-v2-db-${{ github.run_id }}
          restore-keys: |
            satellite-feed-v2-db-

      - name: Execute Satellite Ingestion Engine
        run: python scripts/fetch_satellite.py

      - name: Commit Ledger and Parquet Archive
        run: |
          git config user.name "satellite-bot[bot]"
          git config user.email "satellite-bot@users.noreply.github.com"

          git add ledger/ data/ public/

          if git diff --staged --quiet; then
            echo "No new satellite scene passes to commit."
          else
            git commit -m "chore(satellite): sync optical+SAR scenes and H3 polyfill [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package public directory for Pages
        run: |
          mkdir -p public
          touch public/.nojekyll
          if [ -z "$(ls -A public | grep -v '^\.')" ]; then
            echo "Satellite Intelligence Wire Engine - Active ($(date -u))" > public/index.html
          fi
          tar -cvf /tmp/artifact.tar -C public .

      - name: Upload Artifacts to Pages
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: /tmp/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
