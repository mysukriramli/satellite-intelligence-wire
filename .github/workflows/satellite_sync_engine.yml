name: Satellite Intelligence Wire Engine

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: satellite-sync-compile
  cancel-in-progress: true

jobs:
  ingest-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/satellite_feed.db
          key: satellite-feed-db-${{ github.run_id }}
          restore-keys: |
            satellite-feed-db-

      - name: Execute Satellite Ingestion Engine
        run: python scripts/fetch_satellite.py

      - name: Commit Ledger and Parquet Archive
        run: |
          git config user.name "satellite-bot[bot]"
          git config user.email "satellite-bot@users.noreply.github.com"

          # Stage ledger, data snapshots, and public edge payloads
          git add ledger/ data/ public/

          if git diff --staged --quiet; then
            echo "No new satellite scene passes to commit."
          else
            git commit -m "chore(satellite): sync optical scenes and H3 spatial index [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
